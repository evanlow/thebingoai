name: thebingo-local

services:
  redis:
    image: redis:7-alpine
    container_name: thebingo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  qdrant:
    image: qdrant/qdrant:v1.7.4
    container_name: thebingo-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/tcp/localhost/6333' 2>/dev/null && exit 0 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../../
      dockerfile: docker/backend/Dockerfile
    container_name: thebingo-backend
    ports:
      - "8000:8000"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_URL=redis://redis:6379/2
      - AGENT_MESH_REDIS_URL=redis://redis:6379/4
      - QDRANT_URL=http://qdrant:6333
      - SSO_REDIS_URL=redis://redis:6379/3
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    volumes:
      - ../../backend:/app/backend
      - ../../alembic:/app/alembic
      - ../../data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  celery-worker:
    build:
      context: ../../
      dockerfile: docker/backend/Dockerfile
    container_name: thebingo-celery
    # --concurrency: without it celery forks one worker per core (12 on a dev
    # laptop), and prefork workers are long-lived — RSS only grows. On
    # 2026-07-29 the four worker containers between them held ~16 GiB of a
    # 15.84 GiB Docker VM after two days up, and a global OOM killed the
    # frontend, the backend, and three workers at once. 4 is plenty locally.
    # --max-tasks-per-child recycles a worker after N tasks so its memory is
    # actually handed back; this is the fix that keeps it from creeping.
    command: celery -A backend.tasks.upload_tasks worker --concurrency=4 --max-tasks-per-child=50 --loglevel=info
    mem_limit: 4g
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_URL=redis://redis:6379/2
      - AGENT_MESH_REDIS_URL=redis://redis:6379/4
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - ../../.env
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ../../backend:/app/backend
      - ../../alembic:/app/alembic
      - ../../data:/app/data

  celery-beat:
    build:
      context: ../../
      dockerfile: docker/backend/Dockerfile
    container_name: thebingo-celery-beat
    # Scheduler, single process, no prefork pool — nothing to recycle, just a
    # ceiling so it can't participate in a VM-wide OOM.
    command: celery -A backend.tasks.upload_tasks beat --loglevel=info
    mem_limit: 512m
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_URL=redis://redis:6379/2
    env_file:
      - ../../.env
    depends_on:
      - redis
      - backend
    volumes:
      - ../../backend:/app/backend

  agent-worker:
    build:
      context: ../../
      dockerfile: docker/backend/Dockerfile
    container_name: thebingo-agent-worker
    command: celery -A backend.tasks.upload_tasks worker --queues=agent.data,agent.dashboard,agent.rag,agent.custom --concurrency=2 --max-tasks-per-child=50 --loglevel=info
    mem_limit: 2g
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_URL=redis://redis:6379/2
      - AGENT_MESH_REDIS_URL=redis://redis:6379/4
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - ../../.env
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ../../backend:/app/backend
      - ../../alembic:/app/alembic
      - ../../data:/app/data

  celery-pipelines:
    build:
      context: ../../
      dockerfile: docker/backend/Dockerfile
    container_name: thebingo-pipelines
    # Concurrency stays 10 — `upload_tasks.py:41` documents it as the cap on
    # simultaneous pipeline runs, so lowering it changes dispatch behaviour, not
    # just memory. Bound it with recycling + a ceiling instead.
    command: celery -A backend.tasks.upload_tasks worker --queues=pipelines --concurrency=10 --max-tasks-per-child=50 --loglevel=info
    mem_limit: 4g
    environment:
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_URL=redis://redis:6379/2
      - AGENT_MESH_REDIS_URL=redis://redis:6379/4
      - QDRANT_URL=http://qdrant:6333
    env_file:
      - ../../.env
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_started
    volumes:
      - ../../backend:/app/backend
      - ../../alembic:/app/alembic
      - ../../data:/app/data

  frontend:
    build:
      context: ../../frontend
      # dockerfile path is relative to the build context (../../frontend)
      dockerfile: ../docker/frontend/Dockerfile.dev
    container_name: thebingo-frontend
    ports:
      - "3000:3000"
    environment:
      # Nuxt dev server listens on all interfaces inside the container
      - NUXT_HOST=0.0.0.0
      - NITRO_HOST=0.0.0.0
      # Internal proxy target: Nuxt dev server proxies /api/** to the backend service
      - BACKEND_INTERNAL_URL=http://backend:8000
      # Public API URL: used by the browser (must be reachable from the host)
      - NUXT_PUBLIC_API_BASE_URL=http://localhost:8000
      - NUXT_PUBLIC_GA4_ID=${NUXT_PUBLIC_GA4_ID:-}
    depends_on:
      backend:
        condition: service_healthy
    volumes:
      # Bind-mount source for hot-reload
      - ../../frontend:/app
      # Named volumes keep container-internal directories separate from the host bind-mount:
      # - node_modules: avoids host/container OS/arch mismatch
      # - .nuxt: avoids conflicts between host and container Nuxt build caches
      - frontend_node_modules:/app/node_modules
      - frontend_nuxt:/app/.nuxt

volumes:
  redis_data:
  qdrant_data:
  frontend_node_modules:
  frontend_nuxt:
